[project]
name = "logfree"
version = "0.1.0"
description = "LogFree — menor custo real por km para frotas de última milha (MVP fase 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "click>=8.1",
    "structlog>=24.4",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.118",
    "ruff>=0.7",
    "freezegun>=1.5",
    "respx>=0.21",
]

[project.scripts]
logfree = "app.cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "E501", "S101", "S105", "S106", "B008", "S104",
    "RUF001", "RUF002", "RUF003",  # textos em português usam acentos/aspas Unicode
    "UP042",  # str+Enum funciona; trocar por StrEnum em outro PR
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"alembic/versions/**" = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: testes que tocam DB/API real",
    "slow: testes lentos",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/cli/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
fail_under = 75
